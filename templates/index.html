<script>
  // Seeded Math.random (mulberry32), installed BEFORE any module runs, so library code that calls
  // Math.random at start-up (noise textures, AO kernels) gets the same numbers on every run.
  (function () {
    let a = 0x9e3779b9 >>> 0;
    Math.random = function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  })();
</script>
